<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인블로그 댓글 생성기</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f8faf8;
      margin: 0; padding: 0; color: #222;
    }

    .container {
      max-width: 480px;
      margin: 30px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 30px 24px 40px;
      text-align: center;
    }

    h2 { color:#27ae60; font-size:22px; margin-bottom:20px; font-weight:600; }

    input, button {
      font-size:14px;
      border-radius:6px;
      border:1px solid #ddd;
      padding:10px 12px;
    }
    input:focus { border-color:#2ecc71; outline:none; }

    #link { width:100%; margin-bottom:12px; }

    /* 댓글 수 + 버튼 1:1 정렬 */
    .row.even { display:flex; align-items:center; gap:10px; width:100%; }
    #count { flex:1; text-align:center; height:42px; }
    #generate {
      flex:1; height:42px; font-weight:600; color:#fff; cursor:pointer;
      background:#2ecc71; border:none; transition:background .25s;
    }
    #generate:hover { background:#27ae60; }

    /* 결과 */
    #caption-preview, #result {
      background:#f9f9f9; border-radius:8px; padding:16px; text-align:left;
      font-size:14px; color:#333; margin-top:15px; white-space:pre-wrap; line-height:1.6;
    }

    /* 스켈레톤 */
    .skeleton-line {
      height:12px; margin:6px 0; border-radius:6px;
      background: linear-gradient(90deg, #ececec 25%, #f6f6f6 50%, #ececec 75%);
      background-size: 400% 100%; animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }

    #copyAll {
      display:none; margin-top:10px; background:#27ae60; color:white; border:none;
      border-radius:6px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer;
    }

    footer { margin-top:25px; font-size:12.5px; color:#aaa; }
    footer a { color:#aaa; text-decoration:underline; }

    /* 모바일 */
    @media (max-width:480px){
      .container{ margin:15px 12px; padding:24px 18px 32px; }
      h2{ font-size:18px; }
      input,button{ font-size:13px; }
      #count,#generate{ height:40px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>💬 인블로그 댓글 생성기</h2>

    <!-- 인스타 링크 -->
    <input id="link" placeholder="인스타그램 게시물 링크를 입력하세요" />

    <!-- 댓글 수 + 생성 버튼 (정확히 1:1) -->
    <div class="row even">
      <input id="count" type="number" min="1" max="50" placeholder="댓글 수" />
      <button id="generate">댓글 생성</button>
    </div>

    <!-- 캡션 미리보기 + 결과 -->
    <div id="caption-preview">캡션 미리보기</div>
    <div id="result">댓글이 여기에 표시됩니다.</div>

    <!-- 전체 복사 -->
    <button id="copyAll">모든 댓글 복사</button>

    <footer>
      © 2026 인블로그 AI Comment System<br />
      <a href="https://inblog.co.kr" target="_blank" rel="noopener">https://inblog.co.kr</a>
    </footer>
  </div>

  <script>
    const genBtn = document.getElementById('generate');
    const resultBox = document.getElementById('result');
    const captionBox = document.getElementById('caption-preview');
    const copyBtn = document.getElementById('copyAll');

    genBtn.onclick = async () => {
      const link = document.getElementById('link').value.trim();
      const count = document.getElementById('count').value || 5;

      // 로딩 스켈레톤
      resultBox.innerHTML = `
        <div class="skeleton-line" style="width:92%"></div>
        <div class="skeleton-line" style="width:88%"></div>
        <div class="skeleton-line" style="width:70%"></div>
        <div class="skeleton-line" style="width:95%"></div>
      `;
      captionBox.textContent = '';
      copyBtn.style.display = 'none';
      genBtn.disabled = true; genBtn.textContent = '생성 중...';

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ link, count })
        });
        const data = await res.json();

        if (!data.ok) {
          resultBox.textContent = '❌ ' + data.error;
          return;
        }

        // 캡션 5줄만 표시
        const lines = (data.caption || '').split('\n');
        captionBox.textContent = lines.slice(0, 5).join('\n');
        if (lines.length > 5) captionBox.textContent += '\n...';

        // 댓글 한 칸에 줄바꿈으로
        resultBox.textContent = (data.comments || []).join('\n');
        copyBtn.style.display = 'inline-block';
      } catch (e) {
        resultBox.textContent = '❌ 네트워크 오류';
      } finally {
        genBtn.disabled = false; genBtn.textContent = '댓글 생성';
      }
    };

    copyBtn.onclick = () => {
      navigator.clipboard.writeText(resultBox.textContent);
      alert('✅ 모든 댓글이 복사되었습니다!');
    };
  </script>
</body>
</html>
